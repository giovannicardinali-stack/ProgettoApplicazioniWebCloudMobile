spring.application.name=demo

# Configurazione Database PostgreSQL

#per lavorare con docker:
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8432}/${DB_NAME}
#per lavorare con intellij
#spring.datasource.url=jdbc:postgresql://localhost:8432/demodb

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurazione JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL nei log (comodo in fase di sviluppo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:chiaveSegretaDiSviluppoLungaEComplessa1234567890!}

#Configurazione Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
#Configurazione cache di spring per Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

spring.cache.redis.cache-null-values=false

spring.cache.redis.use-key-prefix=true